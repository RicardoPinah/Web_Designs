<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso con Deshacer</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #CFE6F7; --superficie: #FFFFFF; --borde: #1D2B53; --texto: #1D2B53; --acento: #FFD23F; --sobre-acento: #1D2B53; --rosa: #FF8FAB; --sombra: #1D2B53;
    --grosor: 2px; --radio: 14px; --radio-control: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121A33; --superficie: #1E2A4D; --borde: #EAF2FF; --texto: #EAF2FF; --sobre-acento: #121A33; --sombra: #FF8FAB; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; padding: 32px 20px;
    background: var(--fondo); color: var(--texto);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 500;
  }

  /* Centrado sin «left: 50%», que solo le dejaría media pantalla y se estrecharía con textos largos */
  .toast {
    position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; max-width: 600px;
    bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 60;
    padding: 12px 16px; border: var(--grosor) solid var(--borde); border-radius: var(--radio); background: var(--texto); color: var(--superficie);
    font-size: 14px; font-weight: 800; line-height: 1.35; box-shadow: 4px 4px 0 var(--rosa);
    pointer-events: none;
    animation: toast-entra 0.25s ease-out;
  }
  /* Con «Deshacer» se puede pulsar */
  .toast.con-boton { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 16px; }
  .toast-deshacer {
    flex-shrink: 0; min-height: 40px; padding: 0 10px; border: 0; background: transparent; color: var(--superficie);
    font: inherit; font-weight: 800; font-size: 14px; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--rosa); text-decoration-thickness: 3px; text-underline-offset: 4px;
  }

  @keyframes toast-entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* Solo para el ejemplo */
  .botones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .boton {
    height: 48px; padding: 0 18px; border-radius: var(--radio-control);
    border: var(--grosor) solid var(--borde); background: var(--acento); color: var(--sobre-acento);
    font: inherit; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 var(--sombra);
  }
</style>
</head>
<body>
  <div class="botones">
    <button class="boton" type="button" id="simple">Aviso simple</button>
    <button class="boton" type="button" id="sumar">+1 con Deshacer</button>
    <span>Contador: <strong id="contador">0</strong></span>
  </div>

<script>
  // Aviso flotante. Con { deshacer }, lleva un botón «Deshacer» y dura un poco más.
  function toast(texto, { deshacer } = {}) {
    document.querySelector('.toast')?.remove();
    const div = document.createElement('div');
    div.className = 'toast';
    div.setAttribute('role', 'status');
    div.textContent = texto;
    if (deshacer) {
      const boton = document.createElement('button');
      boton.className = 'toast-deshacer';
      boton.textContent = 'Deshacer';
      boton.addEventListener('click', async () => {
        div.remove();
        try {
          await deshacer();
          toast('Deshecho');
        } catch {
          toast('No se pudo deshacer.');
        }
      });
      div.classList.add('con-boton');
      div.append(boton);
    }
    document.body.append(div);
    setTimeout(() => div.remove(), deshacer ? 5500 : 3200);
  }

  // Solo para el ejemplo
  const contador = document.getElementById('contador');
  document.getElementById('simple').addEventListener('click', () => toast('Guardado'));
  document.getElementById('sumar').addEventListener('click', () => {
    contador.textContent = Number(contador.textContent) + 1;
    toast('Sumado +1', { deshacer: () => { contador.textContent = Number(contador.textContent) - 1; } });
  });
</script>
</body>
</html>
