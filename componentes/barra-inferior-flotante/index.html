<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barra inferior flotante</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #CFE6F7; --superficie: #FFFFFF; --borde: #1D2B53; --texto: #1D2B53; --acento: #FFD23F; --sobre-acento: #1D2B53; --sombra: #1D2B53;
    --grosor: 2px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121A33; --superficie: #1E2A4D; --borde: #EAF2FF; --texto: #EAF2FF; --sobre-acento: #121A33; --sombra: #FF8FAB; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; padding: 32px 20px 110px; /* el padding de abajo deja sitio a la barra */
    background: var(--fondo); color: var(--texto);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 500;
  }

  .nav {
    position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 10;
    max-width: 520px; height: 66px; margin: 0 auto; padding: 5px;
    background: var(--superficie); border: var(--grosor) solid var(--borde); border-radius: 999px;
    box-shadow: 4px 4px 0 var(--sombra);
  }
  .nav-dentro {
    height: 100%;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  }
  .nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: var(--texto); text-decoration: none; font-size: 11px; font-weight: 800;
    border-radius: 999px; border: var(--grosor) solid transparent;
    transition: color 0.2s, background-color 0.2s;
  }
  .nav a[aria-current="page"] { color: var(--sobre-acento); background: var(--acento); border-color: var(--borde); }
  .nav a svg { transition: transform 0.2s ease; }
  .nav a:hover svg { transform: translateY(-2px); }
  /* El icono de la pestaña activa da un pequeño rebote */
  .nav a[aria-current="page"] svg { animation: latido 0.35s ease-out; }

  @keyframes latido { 0% { transform: scale(0.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .nav a, .nav a svg { transition: none; }
    .nav a[aria-current="page"] svg { animation: none; }
  }
</style>
</head>
<body>
  <p>Toca las pestañas de abajo.</p>

  <nav class="nav" aria-label="Navegación principal">
    <div class="nav-dentro">
      <a href="#inicio" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>
        Inicio
      </a>
      <a href="#buscar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        Buscar
      </a>
      <a href="#lista">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        Mi lista
      </a>
      <a href="#amigos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"></path></svg>
        Amigos
      </a>
    </div>
  </nav>

<script>
  // Solo para el ejemplo: en una web real, cada página pone aria-current en su propia pestaña
  const enlaces = document.querySelectorAll('.nav a');
  enlaces.forEach((enlace) => {
    enlace.addEventListener('click', (e) => {
      e.preventDefault();
      enlaces.forEach((otro) => otro.removeAttribute('aria-current'));
      enlace.setAttribute('aria-current', 'page');
    });
  });
</script>
</body>
</html>
