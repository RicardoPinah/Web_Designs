<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esqueletos de carga</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #CFE6F7; --superficie: #FFFFFF; --borde: #1D2B53; --linea: #A9C6DE; --texto: #1D2B53; --apagado: #4F5D80; --acento: #FFD23F; --sobre-acento: #1D2B53; --sombra: #1D2B53;
    --grosor: 2px; --radio: 14px; --radio-control: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121A33; --superficie: #1E2A4D; --borde: #EAF2FF; --linea: #33416A; --texto: #EAF2FF; --apagado: #9DABC9; --sobre-acento: #121A33; --sombra: #FF8FAB; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; padding: 32px 20px;
    background: var(--fondo); color: var(--texto);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 500;
  }
  .ejemplo { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .oculto-visual {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* Huecos grises con la forma de lo que va a salir, con un latido suave */
  .esqueleto-fila { display: flex; align-items: center; gap: 12px; padding: 12px; border: var(--grosor) solid var(--linea); border-radius: var(--radio); list-style: none; }
  .esqueleto-carta { display: flex; flex-direction: column; gap: 6px; }
  .esqueleto-bloque, .esqueleto-linea { background: var(--linea); border-radius: 8px; animation: latir 1.2s ease-in-out infinite; }
  .esqueleto-fila .esqueleto-bloque { width: 56px; height: 80px; flex-shrink: 0; }
  .esqueleto-fila.persona .esqueleto-bloque { width: 44px; height: 44px; border-radius: 50%; }
  .esqueleto-carta .esqueleto-bloque { width: 100%; aspect-ratio: 5 / 7; }
  .esqueleto-linea { height: 12px; width: 80%; }
  .esqueleto-linea.corta { width: 45%; margin-top: 8px; }

  @keyframes latir { 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) {
    .esqueleto-bloque, .esqueleto-linea { animation: none; }
  }

  /* Solo para el ejemplo */
  .filas { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
  .rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .real { display: flex; align-items: center; gap: 12px; padding: 12px; border: var(--grosor) solid var(--borde); border-radius: var(--radio); background: var(--superficie); }
  .real i { display: block; width: 56px; height: 80px; flex-shrink: 0; border-radius: 8px; background: var(--acento); }
  .real.persona i { width: 44px; height: 44px; border-radius: 50%; }
  .real strong { display: block; font-weight: 800; }
  .real span { color: var(--apagado); font-size: 13px; }
  .carta-real i { display: block; aspect-ratio: 5 / 7; border-radius: 8px; background: var(--acento); border: var(--grosor) solid var(--borde); }
  .carta-real strong { display: block; margin-top: 6px; font-size: 13px; font-weight: 800; }
  .boton {
    align-self: flex-start; height: 48px; padding: 0 18px; border-radius: var(--radio-control);
    border: var(--grosor) solid var(--borde); background: var(--acento); color: var(--sobre-acento);
    font: inherit; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 var(--sombra);
  }
  h2 { margin: 12px 0 0; font-size: 17px; font-weight: 800; }
</style>
</head>
<body>
  <div class="ejemplo">
    <button class="boton" type="button" id="cargar">Cargar otra vez</button>
    <h2>Filas</h2>
    <div class="filas" id="filas"></div>
    <h2>Personas</h2>
    <div class="filas" id="personas"></div>
    <h2>Portadas</h2>
    <div class="rejilla" id="cartas"></div>
  </div>

<script>
  // Huecos grises con la forma de lo que va a salir, mientras carga (en vez de «Cargando…»).
  // tipo: 'fila', 'persona' o 'carta'
  function esqueletoHTML(tipo = 'fila', cuantos = 3, etiqueta = 'div') {
    const una = tipo === 'carta'
      ? `<${etiqueta} class="esqueleto-carta" aria-hidden="true"><div class="esqueleto-bloque"></div><div class="esqueleto-linea"></div></${etiqueta}>`
      : `<${etiqueta} class="esqueleto-fila${tipo === 'persona' ? ' persona' : ''}" aria-hidden="true"><div class="esqueleto-bloque"></div><div style="flex: 1"><div class="esqueleto-linea"></div><div class="esqueleto-linea corta"></div></div></${etiqueta}>`;
    return `<span class="oculto-visual" role="status">Cargando…</span>${una.repeat(cuantos)}`;
  }

  // Solo para el ejemplo: simula que los datos tardan en llegar
  const filas = document.getElementById('filas');
  const personas = document.getElementById('personas');
  const cartas = document.getElementById('cartas');
  let espera;

  function cargar() {
    clearTimeout(espera);
    filas.innerHTML = esqueletoHTML('fila', 2);
    personas.innerHTML = esqueletoHTML('persona', 2);
    cartas.innerHTML = esqueletoHTML('carta', 3);
    espera = setTimeout(() => {
      const fila = (clase) => `<div class="real ${clase}"><i></i><div><strong>Título de ejemplo</strong><span>Una línea de descripción</span></div></div>`;
      filas.innerHTML = fila('').repeat(2);
      personas.innerHTML = fila('persona').repeat(2);
      cartas.innerHTML = '<div class="carta-real"><i></i><strong>Título</strong></div>'.repeat(3);
    }, 2000);
  }

  document.getElementById('cargar').addEventListener('click', cargar);
  cargar();
</script>
</body>
</html>
