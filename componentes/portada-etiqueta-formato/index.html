<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada con etiqueta de formato</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #CFE6F7; --superficie: #FFFFFF; --borde: #1D2B53; --texto: #1D2B53; --rosa: #FF8FAB; --rosa-texto: #C2185B;
    --grosor: 2px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121A33; --superficie: #1E2A4D; --borde: #EAF2FF; --texto: #EAF2FF; --rosa-texto: #FF8FAB; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; padding: 32px 20px;
    background: var(--fondo); color: var(--texto);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 500;
  }
  .ejemplo { max-width: 680px; margin: 0 auto; }

  /* Sin imagen, la portada es de un color */
  .portada {
    border-radius: 10px; background-color: var(--rosa); overflow: hidden; flex-shrink: 0;
    position: relative; border: var(--grosor) solid var(--borde);
  }
  .portada img {
    display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none;
    animation: fundido 0.25s ease-out both; transition: transform 0.35s ease;
  }
  .formato {
    position: absolute; top: 4px; left: 4px; padding: 1px 7px; border-radius: 6px;
    background: var(--texto); color: var(--superficie); font-size: 10px; font-weight: 800; letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  /* Tamaños fijos para filas; en rejilla, la proporción 5:7 */
  .portada.p-s { width: 56px; height: 80px; }
  .portada.p-m { width: 64px; height: 90px; }
  .portada.p-l { width: 112px; height: 160px; }
  .carta .portada { width: 100%; aspect-ratio: 5 / 7; }

  .rejilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 560px) { .rejilla { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .carta { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--texto); min-width: 0; }
  .carta-titulo {
    font-size: 13px; font-weight: 800; overflow: hidden; transition: color 0.2s;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* La imagen se acerca un poco y el título cambia de color al pasar por encima */
  .carta:hover .portada img { transform: scale(1.05); }
  .carta:hover .carta-titulo { color: var(--rosa-texto); }

  .tamanos { display: flex; align-items: flex-end; gap: 12px; margin-top: 28px; }

  @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .portada img { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="ejemplo">
    <div class="rejilla">
      <a class="carta" href="#">
        <div class="portada"><img src="https://picsum.photos/seed/portada1/280/392" alt="" loading="lazy"><span class="formato">Anime</span></div>
        <span class="carta-titulo">Título de ejemplo</span>
      </a>
      <a class="carta" href="#">
        <div class="portada"><img src="https://picsum.photos/seed/portada2/280/392" alt="" loading="lazy"><span class="formato">Manga</span></div>
        <span class="carta-titulo">Un título bastante más largo que ocupa dos líneas como mucho</span>
      </a>
      <a class="carta" href="#">
        <div class="portada"><img src="https://picsum.photos/seed/portada3/280/392" alt="" loading="lazy"><span class="formato">Serie</span></div>
        <span class="carta-titulo">Otro título</span>
      </a>
      <a class="carta" href="#">
        <div class="portada" style="background-color: #A7D8C9"><span class="formato">Sin foto</span></div>
        <span class="carta-titulo">Sin imagen: solo el color</span>
      </a>
    </div>

    <div class="tamanos">
      <div class="portada p-s"><img src="https://picsum.photos/seed/portada1/112/160" alt=""></div>
      <div class="portada p-m"><img src="https://picsum.photos/seed/portada2/128/180" alt=""></div>
      <div class="portada p-l"><img src="https://picsum.photos/seed/portada3/224/320" alt=""><span class="formato">Anime</span></div>
    </div>
  </div>
</body>
</html>
