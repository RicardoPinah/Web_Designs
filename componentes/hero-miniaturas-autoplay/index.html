<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero con miniaturas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --acento-1: #f99a31;
    --blanco: #fff;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --edge: max(clamp(1.5rem, 6vw, 6rem), calc((100vw - 104rem) / 2));
    --thumb-h: clamp(2.75rem, 5.5vw, 6rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 400 1.125rem/1.7 var(--body); }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  :focus-visible { outline: 3px solid var(--acento-1); outline-offset: 3px; }

  .hero { position: relative; display: grid; place-items: center; min-height: 100svh; color: var(--blanco); background: var(--oscuro); }
  .slides { position: absolute; inset: 0; overflow: hidden; }
  .slide { position: absolute; inset: 0; opacity: 0; transform: scale(1.05); transition: opacity 1.2s ease-in-out; }
  .slide.is-active { opacity: 1; animation: drift 6s linear both; }
  @keyframes drift {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgb(16 19 17 / 0.68), rgb(16 19 17 / 0.42) 75%),
      linear-gradient(to bottom, rgb(16 19 17 / 0.55), transparent 22%);
  }
  .hero-text { position: relative; z-index: 1; padding: 8rem var(--edge); text-align: center; }
  h1 { margin: 0; font: 400 clamp(2.375rem, 5vw, 5.75rem)/1.12 var(--display); text-wrap: balance; }

  .hero-thumbs {
    position: absolute;
    right: var(--edge);
    bottom: clamp(0.75rem, 2svh, 1.25rem);
    left: var(--edge);
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: clamp(0.35rem, 0.8vw, 0.85rem);
  }
  .thumb {
    position: relative;
    flex: 0 1 calc(var(--thumb-h) * 16 / 9);
    min-width: 0;
    height: var(--thumb-h);
    padding: 0;
    overflow: hidden;
    background: var(--oscuro);
    border: 0;
    border-radius: 10px;
    box-shadow: 0 0.5rem 1.25rem rgb(16 19 17 / 0.3);
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .thumb img { filter: brightness(0.72); transition: filter 0.3s; }
  .thumb:hover, .thumb:focus-visible { transform: scale(1.06); }
  .thumb:hover img, .thumb:focus-visible img, .thumb.is-active img { filter: none; }
  .thumb.is-active { box-shadow: 0 0 0 2px var(--acento-1), 0 0.5rem 1.25rem rgb(16 19 17 / 0.3); }
  .thumb.is-active::after {
    content: '';
    position: absolute;
    inset: 0 0 auto;
    height: 3px;
    background: var(--acento-1);
    transform-origin: left;
    animation: thumb-progress 6s linear both;
  }
  .is-paused .thumb.is-active::after { animation: none; transform: none; }
  @keyframes thumb-progress {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .slide, .thumb { transition: none; }
    .slide.is-active { animation: none; }
    .thumb.is-active::after { animation: none; transform: none; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="slides">
      <img class="slide is-active" src="https://picsum.photos/seed/slide-1/1920/1080" alt="Foto de ejemplo 1" fetchpriority="high">
      <img class="slide" src="https://picsum.photos/seed/slide-2/1920/1080" alt="Foto de ejemplo 2" aria-hidden="true">
      <img class="slide" src="https://picsum.photos/seed/slide-3/1920/1080" alt="Foto de ejemplo 3" aria-hidden="true">
      <img class="slide" src="https://picsum.photos/seed/slide-4/1920/1080" alt="Foto de ejemplo 4" aria-hidden="true">
    </div>
    <div class="hero-thumbs" role="group" aria-label="Elegir foto">
      <button class="thumb is-active" type="button" aria-label="Ver foto 1" aria-pressed="true"><img src="https://picsum.photos/seed/slide-1/1920/1080" alt=""></button>
      <button class="thumb" type="button" aria-label="Ver foto 2" aria-pressed="false"><img src="https://picsum.photos/seed/slide-2/1920/1080" alt=""></button>
      <button class="thumb" type="button" aria-label="Ver foto 3" aria-pressed="false"><img src="https://picsum.photos/seed/slide-3/1920/1080" alt=""></button>
      <button class="thumb" type="button" aria-label="Ver foto 4" aria-pressed="false"><img src="https://picsum.photos/seed/slide-4/1920/1080" alt=""></button>
    </div>
    <div class="hero-text"><h1>Un titular de ejemplo</h1></div>
  </section>

<script>
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Las miniaturas eligen la foto del hero y, sin movimiento reducido, cambian solas.
  const slideImages = [...document.querySelectorAll('.slide')];
  const thumbs = [...document.querySelectorAll('.thumb')];
  const thumbRow = document.querySelector('.hero-thumbs');
  let current = 0;
  let timer;
  let paused = false;

  const show = (index) => {
    current = (index + slideImages.length) % slideImages.length;
    slideImages.forEach((slide, i) => {
      slide.classList.toggle('is-active', i === current);
      slide.toggleAttribute('aria-hidden', i !== current);
    });
    thumbs.forEach((thumb, i) => {
      thumb.classList.toggle('is-active', i === current);
      thumb.setAttribute('aria-pressed', String(i === current));
    });
  };
  const play = () => {
    clearInterval(timer);
    if (!calm && !paused) timer = setInterval(() => show(current + 1), 6000);
  };
  const setPaused = (value) => {
    paused = value;
    thumbRow.classList.toggle('is-paused', value);
    play();
  };

  thumbs.forEach((thumb, i) => thumb.addEventListener('click', () => {
    show(i);
    play();
  }));
  thumbRow.addEventListener('pointerenter', () => setPaused(true));
  thumbRow.addEventListener('pointerleave', () => setPaused(false));
  thumbRow.addEventListener('focusin', () => setPaused(true));
  thumbRow.addEventListener('focusout', () => setPaused(false));
  document.addEventListener('visibilitychange', () => setPaused(document.hidden));
  if (calm) thumbRow.classList.add('is-paused');
  play();
</script>
</body>
</html>
