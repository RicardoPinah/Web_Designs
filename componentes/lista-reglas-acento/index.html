<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista con reglas de acento</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --claro: #f2f3ef;
    --acento-1: #f99a31;
    --apagado: #5d645f;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --gutter: clamp(1rem, 4vw, 3.5rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--claro); color: var(--oscuro); font: 400 1.0625rem/1.6 var(--body); }

  .materials {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 2.5rem var(--gutter);
    padding: clamp(4rem, 10vw, 8rem) var(--gutter);
  }
  h2 { grid-column: 1 / span 5; margin: 0; font: 400 clamp(2.25rem, 5.5vw, 4.5rem)/1.05 var(--display); }
  dl { grid-column: 6 / -1; margin: 0; }
  dl div { padding: 1.25rem 0; border-top: 2px solid var(--acento-1); }
  dl div:last-child { border-bottom: 2px solid var(--acento-1); }
  dt { font-weight: 600; }
  dd { margin: 0.2rem 0 0; color: var(--apagado); }

  @media (max-width: 760px) {
    h2, dl { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <section class="materials">
    <h2>Título de ejemplo</h2>
    <dl>
      <div><dt>Primer concepto</dt><dd>Detalle de ejemplo</dd></div>
      <div><dt>Segundo concepto</dt><dd>Detalle de ejemplo algo más largo para ver cómo se reparte el texto</dd></div>
      <div><dt>Tercer concepto</dt><dd>Detalle de ejemplo</dd></div>
    </dl>
  </section>
</body>
</html>
