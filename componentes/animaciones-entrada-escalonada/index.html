<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animaciones de entrada escalonada</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #CFE6F7; --superficie: #FFFFFF; --borde: #1D2B53; --linea: #A9C6DE; --texto: #1D2B53; --acento: #FFD23F; --sobre-acento: #1D2B53; --rosa: #FF8FAB; --rojo-aviso: #D92D20; --sobre-rojo: #FFFFFF; --sombra: #1D2B53;
    --grosor: 2px; --radio: 14px; --radio-control: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121A33; --superficie: #1E2A4D; --borde: #EAF2FF; --linea: #33416A; --texto: #EAF2FF; --sobre-acento: #121A33; --rojo-aviso: #FF6B6B; --sobre-rojo: #121A33; --sombra: #FF8FAB; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh;
    background: var(--fondo); color: var(--texto);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; font-weight: 500; line-height: 1.5;
  }

  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes latido { 0% { transform: scale(0.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes rellenar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes brillo { from { background-position: -200px 0; } to { background-position: calc(200px + 100%) 0; } }

  /* Paso entre páginas: fundido rápido en vez de pantallazo en blanco (navegadores que lo saben hacer) */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.15s; }

  /* Entrada de la página: muy corta, para que la web se sienta rápida */
  .contenedor > * { animation: aparecer 0.2s ease-out backwards; }
  .contenedor > :nth-child(2) { animation-delay: 0.02s; }
  .contenedor > :nth-child(3) { animation-delay: 0.04s; }
  .contenedor > :nth-child(n + 4) { animation-delay: 0.06s; }

  /* Listas y rejillas: cada elemento aparece un poquito después del anterior */
  .lista-filas > * { animation: aparecer 0.2s ease-out backwards; }
  .lista-filas > :nth-child(2) { animation-delay: 0.02s; }
  .lista-filas > :nth-child(3) { animation-delay: 0.04s; }
  .lista-filas > :nth-child(4) { animation-delay: 0.06s; }
  .lista-filas > :nth-child(n + 5) { animation-delay: 0.08s; }

  /* Al repintar una lista por un cambio pequeño: con esta clase en <body> no repite la entrada ni parpadea */
  .quieto .contenedor > *, .quieto .lista-filas > * { animation: none; }

  /* Contador: rebota al aparecer */
  .contador:not([hidden]) { animation: latido 0.4s ease-out; }

  /* Barras de progreso: se rellenan suavemente */
  .progreso { height: 12px; border: var(--grosor) solid var(--borde); border-radius: 999px; overflow: hidden; background: var(--superficie); }
  .progreso div { height: 100%; background: var(--rosa); transition: width 0.5s ease; animation: rellenar 0.7s ease-out both; transform-origin: left; }

  /* "Cargando…" con un brillo que pasa */
  .cargando {
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rosa) 20%, transparent), transparent) no-repeat;
    background-size: 200px 100%;
    animation: brillo 1.2s linear infinite;
    border-radius: var(--radio);
  }

  /* Quien prefiere menos movimiento (ajuste del sistema operativo) */
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Solo para el ejemplo */
  .contenedor { max-width: 560px; margin: 0 auto; padding: 32px 20px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; }
  p { margin: 0; }
  .lista-filas { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .lista-filas li { padding: 12px 14px; background: var(--superficie); border: var(--grosor) solid var(--borde); border-radius: var(--radio); font-weight: 800; }
  .fila-contador { display: flex; align-items: center; gap: 10px; }
  .contador {
    min-width: 20px; height: 20px; padding: 0 4px;
    background: var(--rojo-aviso); color: var(--sobre-rojo); border: var(--grosor) solid var(--borde); border-radius: 999px;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .cargando { padding: 12px 14px; border: var(--grosor) dashed var(--linea); text-align: center; }
  .boton {
    align-self: flex-start; height: 48px; padding: 0 18px; border-radius: var(--radio-control);
    border: var(--grosor) solid var(--borde); background: var(--acento); color: var(--sobre-acento);
    font: inherit; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 var(--sombra);
  }
</style>
</head>
<body>
  <main class="contenedor" id="pagina">
    <h1>Entrada de la página</h1>
    <button class="boton" type="button" id="repetir">Repetir</button>
    <ul class="lista-filas">
      <li>Primer elemento</li>
      <li>Segundo elemento</li>
      <li>Tercer elemento</li>
      <li>Cuarto elemento</li>
      <li>Quinto elemento</li>
    </ul>
    <div class="fila-contador"><span>Contador que rebota</span><span class="contador">3</span></div>
    <div class="progreso" role="img" aria-label="Progreso: 65 %"><div style="width: 65%"></div></div>
    <div class="cargando">Cargando…</div>
  </main>

<script>
  // Solo para el ejemplo: volver a insertar la página repite sus animaciones
  document.addEventListener('click', (e) => {
    if (e.target.id !== 'repetir') return;
    const pagina = document.getElementById('pagina');
    pagina.replaceWith(pagina.cloneNode(true));
  });
</script>
</body>
</html>
