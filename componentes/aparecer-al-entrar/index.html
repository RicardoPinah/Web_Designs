<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aparecer al entrar</title>
<style>
  body { margin: 0; padding: 40vh 1.5rem; background: #f2f3ef; color: #1c211e; font: 400 1.125rem/1.7 system-ui, sans-serif; }
  .bloque { max-width: 40rem; margin: 0 auto 40vh; padding: 3rem; background: #fff; border-radius: 14px; }

  .will-reveal {
    opacity: 0;
    transform: translateY(1.75rem);
    transition: opacity 0.7s ease-out, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .will-reveal.is-visible { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="bloque" data-reveal>Primer bloque</div>
  <div class="bloque" data-reveal>Segundo bloque</div>
  <div class="bloque" data-reveal>Tercer bloque</div>

<script>
  // Cada bloque aparece suavemente la primera vez que entra en pantalla.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const revealed = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealed.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('[data-reveal]').forEach((block) => {
      block.classList.add('will-reveal');
      revealed.observe(block);
    });
  }
</script>
</body>
</html>
