<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjetas de servicios</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --claro: #f2f3ef;
    --acento-1: #f99a31;
    --apagado-sobre-oscuro: #c4c9c4;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --edge: max(clamp(1.5rem, 6vw, 6rem), calc((100vw - 104rem) / 2));
    --space: clamp(7rem, 13vw, 15rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--oscuro); color: var(--claro); font: 400 1.125rem/1.7 var(--body); }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; text-wrap: balance; }
  h2 { font-size: clamp(2.125rem, 1.6rem + 1.9vw, 3.625rem); line-height: 1.15; }
  h3 { font-size: clamp(1.4375rem, 1.15rem + 0.85vw, 2rem); line-height: 1.2; }
  p { margin: 0; color: var(--apagado-sobre-oscuro); }
  :focus-visible { outline: 3px solid var(--acento-1); outline-offset: 3px; }

  .services { padding: var(--space) var(--edge); }
  .section-head { display: grid; justify-items: center; gap: 1.25rem; max-width: 78rem; margin: 0 auto clamp(3.5rem, 6vw, 6.5rem); text-align: center; }
  .eyebrow { color: var(--acento-1); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(3rem, 4vw, 4.5rem) clamp(2rem, 4vw, 4.5rem); }
  .card { display: grid; grid-template-rows: auto auto 1fr auto; justify-items: start; gap: 1.1rem; }
  .card-photo { display: block; width: 100%; aspect-ratio: 3 / 2; margin-bottom: 0.75rem; overflow: hidden; border-radius: 9px; }
  .card-photo img { transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .card:hover .card-photo img { transform: scale(1.05); }
  .more { color: var(--acento-1); font-weight: 600; text-underline-offset: 0.25em; }
  .more span { display: inline-block; transition: transform 0.25s; }
  .more:hover span { transform: translateX(0.3rem); }

  @media (max-width: 60rem) {
    .cards { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-photo img, .more span { transition: none; }
  }
</style>
</head>
<body>
  <section class="services">
    <div class="section-head">
      <p class="eyebrow">Servicios</p>
      <h2>Título de ejemplo para la sección</h2>
    </div>
    <div class="cards">
      <article class="card">
        <a class="card-photo" href="#" tabindex="-1" aria-hidden="true"><img src="https://picsum.photos/seed/tarjeta-1/900/600" alt="" loading="lazy"></a>
        <h3>Servicio uno</h3>
        <p>Descripción breve de este servicio.</p>
        <a class="more" href="#" aria-label="Leer más sobre el servicio uno">Leer más <span aria-hidden="true">→</span></a>
      </article>
      <article class="card">
        <a class="card-photo" href="#" tabindex="-1" aria-hidden="true"><img src="https://picsum.photos/seed/tarjeta-2/900/600" alt="" loading="lazy"></a>
        <h3>Servicio dos</h3>
        <p>Descripción breve de este servicio, algo más larga para ver cómo se alinean los enlaces.</p>
        <a class="more" href="#" aria-label="Leer más sobre el servicio dos">Leer más <span aria-hidden="true">→</span></a>
      </article>
      <article class="card">
        <a class="card-photo" href="#" tabindex="-1" aria-hidden="true"><img src="https://picsum.photos/seed/tarjeta-3/900/600" alt="" loading="lazy"></a>
        <h3>Servicio tres</h3>
        <p>Descripción breve de este servicio.</p>
        <a class="more" href="#" aria-label="Leer más sobre el servicio tres">Leer más <span aria-hidden="true">→</span></a>
      </article>
    </div>
  </section>
</body>
</html>
