<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabecera oscura de página</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --blanco: #fff;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --gutter: clamp(1rem, 4vw, 3.5rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 400 1.0625rem/1.6 var(--body); }

  /* El espacio superior deja sitio a un header absoluto. */
  .page-intro {
    padding: 8.5rem var(--gutter) clamp(3rem, 7vw, 5.5rem);
    background: var(--oscuro);
    color: var(--blanco);
  }
  h1 { max-width: 18ch; margin: 0; font: 400 clamp(2.5rem, 6.5vw, 5.75rem)/1.05 var(--display); }
  p { margin: 1.5rem 0 0; max-width: 56ch; font-size: clamp(1.0625rem, 1.5vw, 1.25rem); }
</style>
</head>
<body>
  <section class="page-intro">
    <h1>Título de la página</h1>
    <p>Texto de ejemplo que presenta el contenido de esta página.</p>
  </section>
</body>
</html>
