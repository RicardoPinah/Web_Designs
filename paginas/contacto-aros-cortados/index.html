<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto con aros cortados</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --claro: #f2f3ef;
    --acento-1: #f99a31;
    --acento-2: #f99a62;
    --acento-3: #f2ab82;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --edge: max(clamp(1.5rem, 6vw, 6rem), calc((100vw - 104rem) / 2));
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 400 1.0625rem/1.6 var(--body); }
  :focus-visible { outline: 3px solid var(--acento-1); outline-offset: 3px; }

  .contact {
    position: relative;
    overflow: hidden;
    padding: clamp(4rem, 10vw, 8rem) var(--edge);
    background: var(--oscuro);
    color: var(--claro);
  }
  .contact > :not(.contact-rings) { position: relative; }
  h2 { max-width: 12ch; margin: 0; font: 400 clamp(2.25rem, 5.5vw, 4.5rem)/1.05 var(--display); }
  .contact-rings {
    position: absolute;
    top: 50%;
    right: -8%;
    width: min(46vw, 42rem);
    transform: translateY(-50%);
  }
  p { margin: 1.25rem 0 0; max-width: 48ch; }
  .contact-links {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
    margin-top: 2.25rem;
    font: clamp(1.4rem, 3.4vw, 2.5rem)/1.15 var(--display);
  }
  a {
    color: inherit;
    overflow-wrap: anywhere;
    text-underline-offset: 0.15em;
    text-decoration-color: var(--acento-1);
    text-decoration-thickness: 2px;
  }

  @media (max-width: 760px) {
    .contact { padding-bottom: 12rem; }
    .contact-rings { top: auto; right: -10%; bottom: -1rem; width: 72vw; transform: none; }
  }
</style>
</head>
<body>
  <section class="contact">
    <svg class="contact-rings" viewBox="0 0 393 179" aria-hidden="true">
      <path fill="var(--acento-1)" fill-rule="evenodd" d="M20 0H373A20 20 0 0 1 393 20V159A20 20 0 0 1 373 179H20A20 20 0 0 1 0 159V20A20 20 0 0 1 20 0ZM44 19H368A15 15 0 0 1 383 34V159A15 15 0 0 1 368 174H44A15 15 0 0 1 29 159V34A15 15 0 0 1 44 19Z"/>
      <path fill="var(--acento-2)" fill-rule="evenodd" d="M46 24H365A13 13 0 0 1 378 37V157A13 13 0 0 1 365 170H46A13 13 0 0 1 33 157V37A13 13 0 0 1 46 24ZM71 41H359A10 10 0 0 1 369 51V154A10 10 0 0 1 359 164H71A10 10 0 0 1 61 154V51A10 10 0 0 1 71 41Z"/>
      <path fill="var(--acento-3)" fill-rule="evenodd" d="M75 48H355A9 9 0 0 1 364 57V151A9 9 0 0 1 355 160H75A9 9 0 0 1 66 151V57A9 9 0 0 1 75 48ZM100 65H347A7 7 0 0 1 354 72V143A7 7 0 0 1 347 150H100A7 7 0 0 1 93 143V72A7 7 0 0 1 100 65Z"/>
    </svg>
    <h2>Hablemos de tu proyecto</h2>
    <p>Texto de ejemplo que invita a escribir y dice dónde se trabaja.</p>
    <div class="contact-links">
      <a href="tel:+15550100">555-0100</a>
      <a href="mailto:hola@example.com">hola@example.com</a>
    </div>
  </section>
</body>
</html>
