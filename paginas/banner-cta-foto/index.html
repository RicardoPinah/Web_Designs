<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner con foto y botón</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oscuro: #1c211e;
    --acento-1: #f99a31;
    --blanco: #fff;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', system-ui, sans-serif;
    --edge: max(clamp(1.5rem, 6vw, 6rem), calc((100vw - 104rem) / 2));
    --space: clamp(7rem, 13vw, 15rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 400 1.125rem/1.7 var(--body); }
  :focus-visible { outline: 3px solid var(--acento-1); outline-offset: 3px; }

  .banner {
    position: relative;
    display: grid;
    place-items: center;
    min-height: clamp(34rem, 54vw, 56rem);
    padding: var(--space) var(--edge);
    overflow: hidden;
    color: var(--blanco);
    background: var(--oscuro);
    text-align: center;
  }
  .banner img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
  .banner::after { content: ''; position: absolute; inset: 0; background: rgb(16 19 17 / 0.62); }
  .banner-text { position: relative; z-index: 1; display: grid; justify-items: center; gap: 1.75rem; max-width: 60rem; }
  h2 { margin: 0; font: 400 clamp(2.125rem, 1.6rem + 1.9vw, 3.625rem)/1.15 var(--display); text-wrap: balance; }
  p { margin: 0; max-width: 62ch; }
  .button {
    display: inline-block;
    padding: 0.85rem 1.9rem;
    background: var(--acento-1);
    border-radius: 9px;
    color: var(--oscuro);
    font-weight: 700;
    line-height: 1.3;
    text-decoration: none;
    transition: background-color 0.25s, transform 0.25s;
  }
  .button:hover { background: var(--blanco); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
  }
</style>
</head>
<body>
  <section class="banner">
    <img src="https://picsum.photos/seed/banner/1920/1080" alt="" loading="lazy">
    <div class="banner-text">
      <h2>Una llamada a la acción de ejemplo</h2>
      <p>Texto de ejemplo que explica qué pasa al pulsar el botón.</p>
      <a class="button" href="#">Empezar</a>
    </div>
  </section>
</body>
</html>
